
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Application Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#087443;color:white;text-align:center;padding:25px 15px}
.container{max-width:480px;margin:24px auto;padding:15px}
.card{background:white;padding:22px;border-radius:14px}
label{display:block;font-weight:bold;margin:15px 0 7px}
input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:8px;background:#087443;color:white;font-size:16px}
</style>
</head>
<body>
<header>
<h1>Loan Application</h1>
<p>Online Application Portal</p>
</header>
<main class="container">
<section class="card">
<h2>Apply for a Loan</h2>
<form id="loanForm">
<label for="name">Full Name</label>
<input id="name" name="name" required maxlength="100">
<label for="phone">Phone Number</label>
<input id="phone" name="phone" type="tel" required maxlength="20">
<label for="country">Country</label>
<select id="country" name="country" required>
<option value="">Select country</option>
<option>Kenya</option>
<option>Zimbabwe</option>
<option>Other</option>
</select>
<label for="amount">Loan Amount Requested</label>
<input id="amount" name="amount" type="number" min="1" required>
<label for="income">Monthly Income</label>
<input id="income" name="income" type="number" min="0" required>
<label for="purpose">Purpose of Loan</label>
<select id="purpose" name="purpose" required>
<option value="">Select purpose</option>
<option>Business</option>
<option>Education</option>
<option>Emergency</option>
<option>Personal needs</option>
<option>Other</option>
</select>
<label><input type="checkbox" required style="width:auto">
I agree to the use of my details to assess my application.
</label>
<button type="submit">Submit Application</button>
<p id="message"></p>
</form>
<p>Submitting an application does not guarantee approval. Review the lender's terms, fees and privacy policy before applying. Never share your mobile money PIN or password.</p>
</section>
</main>
<script>
document.getElementById("loanForm").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("message").textContent="The application form is ready, but online submission is not connected yet.";
});
</script>
</body>
</html>
